apiVersion: 1

policies:
  - orgId: 1
    receiver: Telegram Monitor
    group_by:
      - grafana_folder
      - alertname
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 5m
    routes:
      - receiver: Telegram Monitor
        matchers:
          - team = carnivorous-greenhouse
        continue: false
