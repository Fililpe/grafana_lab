apiVersion: 1

groups:
  - orgId: 1
    name: carnivorous_greenhouse_alerts
    folder: Carnivorous Green House
    interval: 30s
    rules:
      - uid: high_error_rate_loki
        title: Alta Taxa de Erros na Aplicação (Loki)
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({level="ERROR"}[5m]))'
              queryType: range
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: replaceNN
                replaceWithValue: 0
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Mais de 3 eventos ERROR detectados nos últimos 5 minutos'
          description: 'A aplicação Carnivorous Green House registrou pico de erros (HTTP 409/500 ou modo de falhas ativo) no Loki.'
        labels:
          severity: critical
          team: carnivorous-greenhouse
